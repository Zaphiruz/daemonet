name: CI
on:
  # Docs-only changes do not run CI, and because Deploy is triggered by a green CI run on main,
  # they do not redeploy production either.
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daemonet
          POSTGRES_PASSWORD: daemonet
          POSTGRES_DB: daemonet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daemonet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://daemonet:daemonet@127.0.0.1:5432/daemonet_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @daemonet/frontend build
      # hidden evolution requirements must not reach the browser bundle or the sandbox static files
      - run: pnpm check:bundles

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daemonet
          POSTGRES_PASSWORD: daemonet
          POSTGRES_DB: daemonet_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U daemonet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://daemonet:daemonet@127.0.0.1:5432/daemonet_e2e
      AUTH_DEV_BYPASS: "true"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @daemonet/frontend exec playwright install --with-deps chromium
      - name: Start the sim and the API
        run: |
          PORT=3000 node apps/sim/dist/runtime/main.js > sim.log 2>&1 &
          PORT=3001 SESSION_SECRET=ci-session-secret-ci-session-secret-ci SESSION_COOKIE_SECURE=false FRONTEND_ORIGIN=http://127.0.0.1:4173 node apps/api/dist/server.js > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ws/ready && curl -sf http://127.0.0.1:3001/api/ready; then exit 0; fi
            sleep 1
          done
          echo "sim or api did not become ready"; tail -n 50 sim.log api.log; exit 1
      # The production image (Caddy + the real CSP headers) is what the browser talks to. Host networking
      # lets it reach the sim and api on 127.0.0.1; the Caddyfile copy only moves the listener to 4173 and the
      # api upstream to 3001 (the sim already owns 3000 here). Everything else is the shipped Caddyfile.
      - name: Build and start the frontend image
        run: |
          docker build -f apps/frontend/Dockerfile -t daemonet-frontend:ci .
          sed -e 's/^:80 {/:4173 {/' -e 's/api:3000/api:3001/' apps/frontend/Caddyfile > "$RUNNER_TEMP/Caddyfile"
          docker run -d --name frontend --network host \
            --add-host sim:127.0.0.1 --add-host api:127.0.0.1 \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" daemonet-frontend:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/api/ready; then exit 0; fi
            sleep 1
          done
          echo "frontend did not become ready"; docker logs frontend; exit 1
      - run: pnpm --filter @daemonet/frontend e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
      - if: failure()
        run: tail -n 50 sim.log api.log; docker logs --tail 50 frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          if-no-files-found: ignore

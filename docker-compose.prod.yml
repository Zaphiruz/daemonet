x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Shared by sim and api: Vault credentials from .env (VAULT_ADDR + VAULT_TOKEN only, everything
# else comes from Vault at start through each app's entrypoint allowlist) and the production hardening.
x-app-service: &app-service
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: UTC
    NODE_EXTRA_CA_CERTS: /etc/ssl/extra/cloudflare-ca.crt
  volumes:
    - /usr/local/share/ca-certificates/cloudflare-origin-ca.crt:/etc/ssl/extra/cloudflare-ca.crt:ro
  # SIGTERM runs each app's graceful shutdown (the sim kicks clients, checkpoints and closes).
  # Keep the grace period at 10 s or more; Docker's own default is exactly 10 s, so this leaves headroom.
  stop_signal: SIGTERM
  stop_grace_period: 30s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp"]
  logging: *default-logging

services:
  sim:
    <<: *app-service
    build: { context: ., dockerfile: apps/sim/Dockerfile }
    image: daemonet-sim:latest
    # S1 is otherwise idle, but keep the 16 Hz loop from starving the box during builds.
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 256

  api:
    <<: *app-service
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: daemonet-api:latest
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 256

  frontend:
    build: { context: ., dockerfile: apps/frontend/Dockerfile }
    image: daemonet-frontend:latest
    restart: unless-stopped
    depends_on:
      sim:
        condition: service_healthy
      api:
        condition: service_healthy
    # Caddy as root with only the bind capability, read-only root filesystem; /data and /config are
    # Caddy's state (nothing is persisted: there is no TLS here, nginx on LC2 terminates it).
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/data", "/config", "/tmp"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    ports: ["192.168.40.21:3010:80"]   # LAN address only; nginx on LC2 is the only intended client
    logging: *default-logging
